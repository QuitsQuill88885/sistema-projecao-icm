<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Sistema</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0b1526;color:#eaf0fb;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
.tudo{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(ellipse at 50% 38%, #16294a 0%, #0b1526 70%)}
.marca{animation:sobe .6s ease-out both}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px;letter-spacing:.5px;font-weight:800;animation:sobe .6s .1s ease-out both}
p{font-size:13px;color:#8fa8cf;animation:sobe .6s .2s ease-out both}
.barra{width:230px;height:4px;border-radius:4px;background:#1e2d49;overflow:hidden;margin-top:6px;
       animation:sobe .6s .3s ease-out both}
.barra i{display:block;height:100%;width:38%;border-radius:4px;
         background:linear-gradient(90deg,#a31a1a,#f5d76e);animation:anda 1.15s ease-in-out infinite}
@keyframes anda{0%{transform:translateX(-100%)}100%{transform:translateX(365%)}}
.rodape{position:absolute;bottom:18px;font-size:11px;color:#556f96}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style></head><body>
<div class="tudo">
  <div class="marca" id="marca"></div>
  <h1>Sistema</h1>
  <p id="msg">Preparando os louvores e a Bíblia…</p>
  <div class="barra"><i></i></div>
  <div class="rodape">Projeção da igreja · funciona sem internet</div>
</div>
<script src="icones.js"></script>
<script>
  document.getElementById('marca').innerHTML = (window.Icones && window.Icones.MARCA) ? window.Icones.MARCA(86) : '';
  const frases = ['Preparando os louvores e a Bíblia…','Carregando a coletânea…','Quase lá…'];
  let i = 0;
  setInterval(() => { i = (i + 1) % frases.length; document.getElementById('msg').textContent = frases[i]; }, 2200);
</script>
</body></html>
