<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retorno — ICM Iperó</title>
<!--
  A TV DE RETORNO (pedido dele, 15/10/2026, para a Evangelização de Crianças de 25/10).
  Um segundo computador (o Vaio) abre esta página pela rede, apontando para o PC
  principal: http://<PC>:<porta>/retorno.html. Nada se instala no Vaio.

  Enquanto o telão mostra uma parte do louvor, aqui aparece o GESTINHO daquela
  parte, para a irmã que puxa os gestos. Fora do louvor, o quadro "padrão cinema":
  o próximo louvor, o versículo e a hora.

  De onde vem cada coisa (tudo já existia no Sistema; esta página só LÊ):
    /api/estado  -> o que está no ar (tipo, louvor, slide, slidepp, a Lista inteira e a posição)
    /api/tela    -> a letra da tela no ar (reserva quando o gesto ainda não foi ligado)
    dados/louvores.js -> para saber a CHAVE do louvor (num|titulo|1a linha)
    dados/gestos.js   -> a tabela de gestos: window.GESTOS = {
        "louvor:<chave>": { "<tela>": {"img": "gestos/....png", "louvor": "TITULO"} },
        "apres:<nome da apresentação>": { "<slide>": {"img": "...", "louvor": "TITULO"} } }
-->
<style>
  :root { --fundo:#05070d; --texto:#f4f1e8; --apagado:#8a93a6; --ouro:#f2c14e; --verde:#5bd18b; --vermelho:#ff6b6b; }
  html, body { margin:0; height:100%; background:var(--fundo); color:var(--texto);
    font-family: "Segoe UI", "Ubuntu", "Noto Sans", Arial, sans-serif; overflow:hidden; }
  #topo { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between;
    align-items:center; padding:1.2vh 2.5vw; font-size:3.2vh; color:var(--apagado); }
  #topo b { color:var(--texto); }
  #sinal { font-size:2.4vh; }
  #sinal.ok { color:var(--verde); } #sinal.mal { color:var(--vermelho); }
  .tela { position:fixed; inset:7vh 0 0 0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .tela.on { display:flex; }
  #g-img { max-width:92vw; max-height:70vh; object-fit:contain; border-radius:2vh; background:#fff; }
  #g-parte { margin-top:2vh; font-size:4vh; color:var(--ouro); letter-spacing:.05em; }
  #g-letra { font-size:6.2vh; line-height:1.25; font-weight:600; max-width:92vw; }
  #g-letra .rot { display:block; font-size:3.4vh; color:var(--ouro); margin-bottom:1.5vh; }
  #c-hora { font-size:16vh; font-weight:200; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  .c-rot { font-size:3.2vh; color:var(--apagado); text-transform:uppercase; letter-spacing:.3em; margin-top:4vh; }
  #c-prox { font-size:7.5vh; font-weight:700; color:var(--ouro); max-width:92vw; }
  #c-vers { font-size:5vh; max-width:88vw; }
  /* 3.0.9: o espelho do telão (o próprio projecao.html, alimentado pelo /api/tela) */
  #espelho { inset:0; z-index:5; background:#000; }
  #esp-f { width:100%; height:100%; border:0; display:block; background:#000; }
  body.sem-topo #topo { display:none; }
  /* 3.0.9: o par com o computador da projeção */
  #faixa { position:fixed; left:0; right:0; bottom:0; padding:1.4vh 2.5vw; font-size:2.6vh; text-align:center;
    background:#16233ccc; color:var(--ouro); z-index:20; display:none; }
  #dispensado .d-tit { font-size:5vh; max-width:80vw; }
  #d-denovo { margin-top:4vh; font:600 2.8vh "Segoe UI", sans-serif; padding:1.4vh 3vw; border-radius:1vh;
    border:1px solid #2c3d5c; background:#1e2d49; color:var(--texto); cursor:pointer; }
  /* o quadradinho do "Identificar" do Windows, nas cores do Sistema (azul, borda e número em ouro) */
  #ident { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:#05070d8c; opacity:0; transition:opacity .35s; pointer-events:none; }
  #ident.on { opacity:1; }
  #ident .q { width:46vh; height:46vh; border-radius:6vh; background:linear-gradient(160deg,#14487a,#0f2f5e);
    border:.7vh solid #f5d76e; box-shadow:0 4vh 12vh #000c; display:flex; flex-direction:column;
    align-items:center; justify-content:center; }
  #ident b { font-size:30vh; font-weight:800; line-height:1; color:#f5d76e; }
  #ident span { font-size:3.6vh; color:#eaf0fb; margin-top:1.5vh; letter-spacing:.04em; }
</style>
</head>
<body>
<div id="topo"><span id="t-oque">Retorno</span><span id="sinal">procurando o computador principal…</span></div>

<!-- durante o louvor: o gesto (ou a letra, enquanto o gesto não foi ligado) -->
<section class="tela" id="gesto">
  <img id="g-img" alt="">
  <div id="g-letra"></div>
  <div id="g-parte"></div>
</section>

<!-- fora do louvor: padrão cinema -->
<section class="tela on" id="cinema">
  <div id="c-hora">--:--</div>
  <div class="c-rot" id="c-prox-rot">Próximo louvor</div>
  <div id="c-prox">—</div>
  <div class="c-rot" id="c-vers-rot">Versículo</div>
  <div id="c-vers">—</div>
</section>

<!-- 3.0.9: Bíblia, aviso, fundo, aula: o MESMO desenho do telão -->
<section class="tela" id="espelho"><iframe id="esp-f" title="o que está no telão"></iframe></section>

<!-- 3.0.9: o operador respondeu "não" à pergunta "Projetar com duas telas?" -->
<section class="tela" id="dispensado">
  <div class="d-tit">O operador preferiu projetar com uma tela só.</div>
  <div class="c-rot">Esta TV fica de fora até o Sistema ser aberto de novo</div>
  <button id="d-denovo">Pedir de novo</button>
</section>

<div id="faixa">Aguardando o operador responder no computador da projeção: “Projetar com duas telas?”</div>
<div id="ident"><div class="q"><b id="ident-n">2</b><span id="ident-rot">Tela de apoio</span></div></div>

<script src="dados/louvores.js"></script>
<script>window.GESTOS = window.GESTOS || {};</script>
<script src="dados/gestos.js" onerror="void 0"></script>
<script>
const $ = s => document.querySelector(s);
const LOUV = window.LOUVORES || [];
const G = () => window.GESTOS || {};
let telaN = -1, telaPayload = null, ultimoVers = '';

function chaveLouvor(s) {      // a MESMA chave do app.js (num|titulo|1a linha da 1a tela)
  return (s.num || '') + '|' + s.titulo + '|' + ((s.slides[0] && s.slides[0].linhas[0]) || '');
}
function limpa(t) { return String(t || '').replace(/\u0001[^\u0001]*\u0001/g, '').trim(); }
function mostra(id) {
  for (const el of document.querySelectorAll('.tela')) el.classList.toggle('on', el.id === id);
}

// O gesto da tela no ar, se a tabela tiver. Devolve {img, louvor, parte} ou null.
function gestoDe(e) {
  if (e.tipo === 'louvor' && LOUV[e.louvor]) {
    const t = G()['louvor:' + chaveLouvor(LOUV[e.louvor])];
    return t && t[String(e.slide)] || null;
  }
  if (e.tipo === 'slide') {
    const ap = apresNoAr(e);
    const t = ap && G()['apres:' + ap];
    return t && t[String(e.slidepp)] || null;
  }
  return null;
}
function apresNoAr(e) {
  if (e.apres) return e.apres;          // o painel publica o nome (aberta pela galeria também)
  const f = e.fila || [], it = f[e.pos];
  return it && it.tipo === 'apres' ? it.rotulo : '';
}

// O PRÓXIMO LOUVOR: na apresentação, o próximo slide com gesto de OUTRO louvor;
// fora dela, o próximo louvor da Lista de Projeção depois do que está no ar.
function proximo(e) {
  if (e.tipo === 'slide') {
    const ap = apresNoAr(e), t = ap && G()['apres:' + ap];
    if (t) {
      const atual = (t[String(e.slidepp)] || {}).louvor || '';
      const ns = Object.keys(t).map(Number).filter(n => n > e.slidepp).sort((a, b) => a - b);
      for (const n of ns) if (t[n].louvor && t[n].louvor !== atual) return t[n].louvor;
    }
  }
  const f = e.fila || [];
  for (let i = (e.pos == null ? -1 : e.pos) + 1; i < f.length; i++)
    if (f[i].tipo === 'louvor') return f[i].rotulo;
  return '';
}
function versiculo(e) {
  const f = e.fila || [];
  for (let i = Math.max(0, e.pos || 0); i < f.length; i++)
    if (f[i].tipo === 'verso' || f[i].tipo === 'biblia') return f[i].rotulo;
  return ultimoVers;
}

function hora() {
  const d = new Date();
  $('#c-hora').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

async function puxaTela() {
  try {
    const r = await fetch('/api/tela?n=' + telaN, { cache: 'no-store' }).then(r => r.json());
    if (r.payload) { telaN = r.n; telaPayload = r.payload; }
    if (telaPayload && telaPayload.modo === 'biblia' && telaPayload.ref) ultimoVers = telaPayload.ref;
  } catch (e) {}
}

// ===== 3.0.9: PROJETAR COM DUAS TELAS =====
// Esta TV se apresenta ao computador da projeção a cada ciclo (GET /api/apoio). Lá o painel pergunta ao
// operador "Projetar com duas telas?". Enquanto ninguém responde, aqui tudo funciona como na 3.0.8, com
// uma faixa embaixo. "local=1" = aberta pelo PRÓPRIO computador da projeção (2ª saída de vídeo, ou a
// capa do telão depois do Trocar): não pergunta nada a ninguém.
const QS = new URLSearchParams(location.search);
const LOCAL = QS.has('local');
const NOME = QS.get('nome') || '';
let apoio = { estado: LOCAL ? 'aceito' : 'pendente', papel: 2, identificar: 0 };
let identAte = 0, pedirDeNovo = false, espPronto = false, espN = -1;

async function ola() {
  if (LOCAL) return;
  try {
    const r = await fetch('/api/apoio?nome=' + encodeURIComponent(NOME) + (pedirDeNovo ? '&denovo=1' : ''),
                          { cache: 'no-store' }).then(r => r.json());
    if (r && r.ok) {
      apoio = r; pedirDeNovo = false;
      if (r.identificar > 0) identAte = Date.now() + r.identificar * 1000;
    }
  } catch (e) {}
}
$('#d-denovo').onclick = () => { pedirDeNovo = true; ola(); };

function especial(nome) { return !!(nome && G()['apres:' + nome]); }

// O que esta TV mostra: gesto/letra (louvor), cinema (espera, nada no ar) ou o espelho do telão.
function modoDe(e, g) {
  if (apoio.papel === 1) return 'espelho';                 // depois do Trocar, ESTA é o telão
  if (e.projetando === false) return 'cinema';
  if (e.tipo === 'louvor' || (e.tipo === 'slide' && g)) return 'gesto';
  if (!e.tipo || e.tipo === 'descanso' || e.tipo === 'preto') return 'cinema';
  if (e.tipo === 'slide' && especial(apresNoAr(e))) return 'cinema';   // a espera da apresentação de gestos: o próximo louvor
  return 'espelho';
}

function alimentaEspelho() {
  const f = $('#esp-f');
  if (!f.getAttribute('src')) {          // só carrega o telão aqui na primeira vez que precisa (poupa o Vaio)
    f.onload = () => { espPronto = true; espN = -1; alimentaEspelho(); };
    f.src = 'projecao.html?espelho=1';
    return;
  }
  if (!espPronto || !telaPayload || espN === telaN) return;
  try {
    f.contentWindow.postMessage(JSON.stringify(espN < 0 ? Object.assign({}, telaPayload, { transicao: false }) : telaPayload), '*');
    espN = telaN;
  } catch (e) {}
}

function mostraIdent() {
  const on = Date.now() < identAte;
  $('#ident').classList.toggle('on', on);
  if (on) {
    $('#ident-n').textContent = apoio.papel === 1 ? '1' : '2';
    $('#ident-rot').textContent = (apoio.papel === 1 ? 'Telão' : 'Tela de apoio') + (apoio.nome && !LOCAL ? ' · ' + apoio.nome : '');
  }
}
setInterval(mostraIdent, 150);

async function ciclo() {
  let r = null;
  try { r = await fetch('/api/estado', { cache: 'no-store' }).then(r => r.json()); } catch (e) {}
  const sinal = $('#sinal');
  if (!r || !r.ok) { sinal.textContent = 'sem sinal do computador principal'; sinal.className = 'mal';
                     document.body.classList.remove('sem-topo'); return; }
  if (r.idade > 10) { sinal.textContent = 'o Sistema do computador principal parou de responder'; sinal.className = 'mal'; }
  else { sinal.textContent = 'ligado ao computador principal'; sinal.className = 'ok'; }
  await ola();
  $('#faixa').style.display = apoio.estado === 'pendente' ? 'block' : 'none';
  if (apoio.estado === 'dispensado') {
    document.body.classList.remove('sem-topo');
    $('#t-oque').textContent = 'Retorno';
    mostra('dispensado');
    return;
  }
  const e = r.estado || {};
  await puxaTela();
  const g = gestoDe(e);
  const modo = modoDe(e, g);
  // no espelho a TV fica limpa como o telão; o topo só volta se o sinal cair
  document.body.classList.toggle('sem-topo', modo === 'espelho' && sinal.className === 'ok');
  if (modo === 'espelho') {
    alimentaEspelho();
    mostra('espelho');
    return;
  }
  if (modo === 'gesto') {
    const tit = g && g.louvor || (LOUV[e.louvor] && e.tipo === 'louvor' ? LOUV[e.louvor].titulo : '');
    $('#t-oque').innerHTML = tit ? '<b>' + tit + '</b>' : 'Louvor';
    if (g && g.img) {
      $('#g-img').src = g.img; $('#g-img').style.display = '';
      $('#g-letra').style.display = 'none';
      $('#g-parte').textContent = g.parte || '';
    } else {
      // gesto ainda não ligado: a letra da tela, grande, para a irmã acompanhar
      $('#g-img').style.display = 'none';
      const p = telaPayload || {};
      $('#g-letra').style.display = '';
      $('#g-letra').innerHTML = (p.label ? '<span class="rot">' + p.label + '</span>' : '') +
        (p.linhas || []).map(limpa).join('<br>');
      $('#g-parte').textContent = p.pos ? 'tela ' + p.pos + ' de ' + p.de : '';
    }
    mostra('gesto');
  } else {
    $('#t-oque').textContent = e.agora ? limpa(e.agora) : 'Retorno';
    const px = proximo(e), vs = versiculo(e);
    $('#c-prox').textContent = px || '—';
    $('#c-prox-rot').style.visibility = px ? '' : 'hidden';
    $('#c-vers').textContent = vs || '';
    $('#c-vers-rot').style.visibility = vs ? '' : 'hidden';
    mostra('cinema');
  }
}
hora(); setInterval(hora, 1000);
ciclo(); setInterval(ciclo, 500);
</script>
</body>
</html>
