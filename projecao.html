<!doctype html><html lang="pt-br"><head>
<meta charset="utf-8"><title>Projeção — ICM Iperó</title>
<style>
@font-face{font-family:'Bebas';src:url('fontes/bebas.otf');font-display:swap}
/* AS CINCO FONTES DO SISTEMA
   ---------------------------------------------------------------------
   Tudo o que a projecao precisa vem DENTRO do pacote: o programa nao
   pergunta nada ao Windows e nao depende de fonte instalada.

   O desenho e a OUTFIT, sob SIL Open Font License. Escolhida depois de
   comparar seis geometricas livres com a Futura Hv BT -- a fonte que os
   PowerPoints da igreja declaram 21.168 vezes -- linha por linha, na tela
   real, no fundo real.

   PESO 700, nao 800. No 800 a letra fica grossa demais e passa sensacao de
   negrito; foi o que ele viu no telao.

   E O ESPACAMENTO E PARTE DA FONTE AQUI. No peso 700 a Outfit e' mais
   estreita que a Futura, e sem espacamento a linha encolhe, quebra em outro
   ponto e o louvor muda de numero de slides.

   Sao DOIS espacamentos, e essa separacao importa: 70% da folga vai entre
   as LETRAS e 30% entre as PALAVRAS. Na primeira tentativa joguei tudo
   entre as letras, e o resultado foi o contrario do esperado -- cada
   palavra virou um bloco solido e o texto pareceu mais grudado ainda.

   NAO MEXA nos valores sem medir de novo: eles nao sao estetica, sao o que
   faz a quebra de linha cair onde a igreja esta acostumada.

   A escolha foi confirmada em consulta -- Isaias 34:1, Mateus 27:54 e
   Daniel 2:20 -- e esta registrada no memorial.
   --------------------------------------------------------------------- */
@font-face{font-family:'Sistema A1';font-weight:400;font-style:normal;font-display:block;
  src:url('fontes/Outfit.ttf') format('truetype-variations');}
@font-face{font-family:'Sistema A2';font-weight:400;font-style:italic;font-display:block;
  src:url('fontes/Outfit.ttf') format('truetype-variations');}
@font-face{font-family:'Sistema A3';font-weight:700 900;font-style:normal;font-display:block;
  src:url('fontes/Outfit.ttf') format('truetype-variations');}
@font-face{font-family:'Sistema A4';font-weight:700 900;font-style:italic;font-display:block;
  src:url('fontes/Outfit.ttf') format('truetype-variations');}
@font-face{font-family:'Sistema A5';font-weight:500;font-style:normal;font-display:block;
  src:url('fontes/Outfit.ttf') format('truetype-variations');}
/* o que faz a linha ocupar o mesmo tanto que a do presbiterio.
   O scaleY estica a letra na vertical sem alargar a linha: medida, a altura da
   maiuscula ja bate (72 contra 71 px), mas a proporcao da Outfit deixa o texto
   com cara de achatado no telao. Esticar 6% resolve a impressao sem mexer em
   onde a linha quebra -- que e' o que nao pode mudar. */
#lou-txt,#bib-txt,#livre,#bib-multi,#fim-tag{
  font-weight:700;letter-spacing:.005em;word-spacing:.018em}
#lou-txt .bloco,#bib-txt .fitw,#livre .fitw,#bib-multi .fitw{
  transform:scaleY(1.06);transform-origin:center}
*{margin:0;padding:0;box-sizing:border-box}
/* NADA aqui se seleciona. Um arrasto sem querer no telão pinta a letra de azul
   na frente da congregação — e na prévia dá para copiar o texto, que também
   não faz sentido nenhum. */
html,body{height:100%;background:#000;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* PALCO 16:9 fixo e centralizado (letterbox) -> texto e fundo sempre alinhados */
#tela{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:min(100vw,177.78vh);height:min(100vh,56.25vw);
      background:#000 center/100% 100% no-repeat;overflow:hidden;container-type:size}
.camada{position:absolute;inset:0;transition:opacity var(--fade,0ms) ease}
#fundo-fx{position:absolute;inset:0;opacity:0;pointer-events:none}
.oculto{opacity:0}
.txt{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;
     text-align:center;line-height:1.3;text-shadow:0 2px 8px #000a;padding:0 5.5%}
.linha{display:block}
#bib-ref,#lou-tit{font-family:'Bebas',sans-serif;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
#bib-ref{color:#f5d76e;font-size:6.9cqh}
#lou-tit{color:#fff3a3;font-size:6.4cqh}
#bib-txt{font-family:'Sistema A4','Sistema A3',sans-serif;color:#fff;font-style:italic;font-size:5.55cqh;flex-direction:column;gap:.15em;text-transform:uppercase}
/* CALIBRADO NA TRANSMISSÃO OFICIAL (louvor 129, fotos de 10/08/2026, medidas
   por script, não no olho): letra 4,36% da altura da tela, avanço entre
   linhas 11,05%, bloco começando a 19% da largura. Dava 6.4cqh com pouco ar;
   o oficial é letra um pouco MENOR com MUITO mais respiro (avanço = 2,5x a
   letra). Os três números abaixo saem dessas medidas:
     5.75cqh  -> maiúscula visual 4,36% (com o scaleY 1.06)
     1.815    -> avanço 11,05% (1.815em x 1.06)
     15.2%    -> borda esquerda do bloco a 19% da tela  */
#lou-txt{font-family:'Sistema A3',sans-serif;color:#fff;font-size:5.75cqh;flex-direction:column;text-transform:uppercase;align-items:flex-start}
#lou-txt .bloco{text-align:left;display:inline-block;width:76%;margin-left:15.2%}
#lou-txt .bloco .linha{display:block;line-height:var(--lh,1.815);margin:0}
#lou-txt .label-coro{display:block;color:#ffff00;font-style:italic;font-size:.72em;letter-spacing:1px;margin-bottom:.12em}
#lou-txt .mk{color:#ffff00}
/* wrapper de medição p/ auto-ajuste (shrink-to-fit) */
.fitw{display:flex;flex-direction:column;gap:.12em;max-width:100%}
/* "fim" no canto inferior direito do último slide do louvor */
/* o "3 de 4" da prévia do celular: grande o bastante pra ler na telinha */
#pos-tag{position:absolute;left:1.6%;bottom:2.4%;display:none;color:#fff;
  background:rgba(8,14,26,.62);border-radius:1.2vw;padding:.5vw 2vw;
  font:700 3.4vw/1.5 'Sistema A3',sans-serif;letter-spacing:.05em;z-index:60}
#fim-tag{position:absolute;right:2.6%;bottom:2.4%;font-family:'Sistema A3',sans-serif;color:#fff;
         opacity:.72;font-size:3.4cqh;letter-spacing:.5px;display:none;text-shadow:0 2px 6px #000b}
#grande{inset:0;font-family:'Bebas',sans-serif;color:#fff;font-size:24cqh;
        font-variant-numeric:tabular-nums;letter-spacing:2px;text-shadow:0 4px 24px #000c;flex-direction:column}
/* O RÓTULO DO CRONÔMETRO — "Momento de oração", "Vigília".
   Herdava a Bebas do número: condensada, maciça, um letreiro. Para o momento
   de oração isso grita. O número continua Bebas (ele TEM que ser lido lá do
   fundo); o rótulo passa para a Outfit em peso médio, menor e bem espaçado —
   é a mesma família do louvor, só que falando baixo. */
#grande small{font-family:'Sistema A5','Sistema A1',sans-serif;font-weight:500;
  font-size:3.6cqh;color:#f5d76e;letter-spacing:.42em;text-indent:.42em;
  text-transform:uppercase;margin-bottom:2.6cqh;opacity:.93}
/* padding maior que o .txt padrão (5,5%): aviso curto crescia até encostar na
   borda — medido 86,6% da largura no "desligue o celular". Nada de telão bate
   na moldura. */
#livre{top:12%;height:76%;font-family:'Sistema A3',sans-serif;color:#fff;font-size:6cqh;flex-direction:column;text-shadow:0 2px 10px #000c;padding:0 9%}
#livre .fitw{gap:.22em;align-items:center;text-align:center}
#livre .mk{font-weight:900;font-size:1.25em;letter-spacing:1px;margin-bottom:.42em;display:block}
.mk{color:#ffff00}   /* trecho/título amarelo (louvor, texto, avisos) */
#livre .mk{font-weight:900}
/* AVISO EM LISTA É TABELA, NÃO PARÁGRAFO.
   Centrando cada linha por si, "Cultos da semana" saía com cada linha
   começando num ponto diferente — medido na tela: 6,8%, 15,8%, 16,1%, 20,9%
   e 24,7% da largura. Agora as colunas se alinham entre si e o BLOCO inteiro
   é que fica centrado; o horário sai dourado e com dígito de largura fixa,
   então os dois-pontos ficam um debaixo do outro. */
#livre .tab{display:grid;column-gap:1.1em;row-gap:.2em;align-items:baseline;
            justify-content:center;text-align:left}
#livre .tab .cel{white-space:nowrap}
#livre .tab .cel.hora{font-variant-numeric:tabular-nums;text-align:center;color:#f5d76e}
/* lista sem separador (aniversariantes, nomes): mesma margem esquerda p/ todos */
#livre .lista{display:flex;flex-direction:column;gap:.2em;text-align:left}
/* ---- ESTILO LIMPO (1 Padrão): faixa no topo (2%..17%) ---- */
.e-limpo #bib-ref{top:2.2%;height:14.5%}
.e-limpo #bib-txt{top:22%;height:74%}
.e-limpo #lou-tit{top:2.2%;height:14.5%;left:14.5%;right:1.5%}
.e-limpo #lou-txt{top:18%;height:76%}   /* idem: a sobra se reparte em cima e embaixo */
/* ---- ESTILO MAPA (mundo): faixa Bíblia 16.5%, Louvor 3% ---- */
.e-mapa #bib-ref{top:16.5%;height:10%}
.e-mapa #bib-txt{top:27.5%;height:70%}
.e-mapa #lou-tit{top:3%;height:9%;left:13.5%;right:1.5%}
/* O bloco é CENTRADO nesta caixa (align-items:center do .txt). Depois da
   quebra dos slides longos, quase todo louvor tem 4 ou 5 linhas — e o texto
   passou a sobrar espaço embaixo e nada em cima. A caixa agora começa mais
   baixo e termina antes: o que sobra fica repartido dos dois lados, que é a
   margem que o Samuel pediu. */
.e-mapa #lou-txt{top:16%;height:78%}
/* ---- MULTI-VERSÍCULO: vários juntos, referência dourada + texto branco itálico ---- */
#bib-multi{font-family:'Sistema A3',sans-serif;flex-direction:column;align-items:center;
           justify-content:center;text-align:left;padding:0 6% 0 8%}
.e-limpo #bib-multi{top:20%;height:77%}
.e-mapa #bib-multi{top:28%;height:69%}
#bib-multi .fitw{align-items:flex-start;gap:0}
#bib-multi .vm-ref{color:#f5d76e;font-weight:900;display:block;margin-top:.5em;line-height:1.1}
#bib-multi .vm-ref.first{margin-top:0}
#bib-multi .vm-txt{color:#fff;font-family:'Sistema A4','Sistema A3',sans-serif;font-style:italic;text-transform:uppercase;display:block;line-height:1.18;margin-top:.05em}
</style></head>
<body>
<div id="tela" class="e-limpo">
  <!-- o fundo NOVO entra por esta camada, em fade; o corte seco pra tela de
       espera (depois do último louvor/animação) era o background trocando
       na hora enquanto só o TEXTO sabia atravessar suave. -->
  <div id="fundo-fx"></div>
  <div class="camada" id="cam">
    <div class="txt" id="bib-ref"></div>
    <div class="txt" id="bib-txt"></div>
    <div class="txt" id="lou-tit"></div>
    <div class="txt" id="lou-txt"></div>
    <div class="txt" id="grande"><small></small><span></span></div>
    <div class="txt" id="livre"></div>
    <div class="txt" id="bib-multi"></div>
    <div id="fim-tag">fim</div>
    <!-- "3 de 4": SÓ na prévia do celular (?previa=1). O operador de lá
         precisa saber qual tela está no ar; a congregação não vê isto. -->
    <div id="pos-tag"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const tela=$('#tela'), cam=$('#cam');
const el={ref:$('#bib-ref'),bib:$('#bib-txt'),tit:$('#lou-tit'),lou:$('#lou-txt'),multi:$('#bib-multi'),
          grandeS:$('#grande small'),grandeV:$('#grande span'),grande:$('#grande'),livre:$('#livre'),fim:$('#fim-tag'),
          pos:$('#pos-tag')};
// prévia do celular? (o iframe do controle abre projecao.html?previa=1)
const PREVIA = new URLSearchParams(location.search).has('previa');
let timerInt=null, relogioInt=null, ULT=null, fadeT=null;
// cursor: aparece ao mexer o mouse, some sozinho após 3s (limpo p/ congregação, sem pânico p/ operador)
const standalone = (window.top===window.self);
if(standalone){
  let hideT;
  const mostrar=()=>{ document.body.style.cursor=''; clearTimeout(hideT); hideT=setTimeout(()=>{document.body.style.cursor='none';},3000); };
  addEventListener('mousemove', mostrar); mostrar();
}

function limpar(){
  for(const k of ['ref','bib','tit','lou','livre','multi']) el[k].style.display='none';
  el.grande.style.display='none'; el.fim.style.display='none'; el.pos.style.display='none';
  clearInterval(timerInt); clearInterval(relogioInt); timerInt=relogioInt=null;
}
// monta uma linha; trechos entre  saem AMARELOS (ex.: "(BIS)", "(2X)")
function montarLinha(str){
  const s=document.createElement('span'); s.className='linha';
  String(str).split('').forEach((p,i)=>{
    if(i%2){ const y=document.createElement('span'); y.className='mk'; y.textContent=p; s.appendChild(y); }
    else if(p) s.appendChild(document.createTextNode(p));
  });
  return s;
}
function linhas(cont, arr){ cont.innerHTML=''; cont.style.display='flex';
  const w=document.createElement('div'); w.className='fitw';
  for(const l of arr) w.appendChild(montarLinha(l));
  cont.appendChild(w); }
// Avisos: o título (marcado, amarelo) fica centrado; o CORPO, quando é lista,
// vira tabela alinhada. Sem isto "Cultos da semana" ficava com cada linha
// começando num lugar — foi o que o Samuel chamou de "tudo desalinhado".
const SEP_AVISO=/\s+[—–-]\s+/;
const EH_HORA=/^\d{1,2}[:h]\d{2}$/;
function montarAviso(cont, arr){
  cont.innerHTML=''; cont.style.display='flex';
  const w=document.createElement('div'); w.className='fitw';
  const tit=[], corpo=[];
  for(const l of (arr||[])) (String(l).indexOf('')>=0 ? tit : corpo).push(l);
  tit.forEach(l=>w.appendChild(montarLinha(l)));
  const cel=corpo.map(l=>String(l).split(SEP_AVISO).map(s=>s.trim()));
  const cols=cel.length?Math.max.apply(null,cel.map(c=>c.length)):0;
  // tabela só quando a lista REALMENTE é tabular (2+ linhas, todas com o mesmo
  // número de partes) — uma frase solta com travessão continua sendo frase
  const tabular = corpo.length>=2 && cols>=2 && cel.every(c=>c.length===cols);
  if(tabular){
    const t=document.createElement('div'); t.className='tab';
    t.style.gridTemplateColumns='repeat('+cols+',auto)';
    cel.forEach(c=>c.forEach(v=>{
      const d=document.createElement('span');
      d.className='cel'+(EH_HORA.test(v)?' hora':''); d.textContent=v; t.appendChild(d);
    }));
    w.appendChild(t);
  } else if(corpo.length>=3){
    const b=document.createElement('div'); b.className='lista';
    corpo.forEach(l=>b.appendChild(montarLinha(l)));
    w.appendChild(b);
  } else {
    corpo.forEach(l=>w.appendChild(montarLinha(l)));
  }
  cont.appendChild(w);
}
/* O fundo atravessa em FADE (o corte seco pra tela de espera era aqui): o
   fundo novo entra pela camada #fundo-fx com a MESMA duração do texto, e só
   depois vira o fundo de verdade. Com fade 0 continua instantâneo. */
let FUNDO_ATUAL=null, FUNDO_T=null;
const fx=document.querySelector('#fundo-fx');
function fundo(url){
  const alvo = url?`#000 url('${url}') center/100% 100% no-repeat`:'#000';
  if(alvo===FUNDO_ATUAL) return;
  FUNDO_ATUAL=alvo;
  const ms=parseFloat(getComputedStyle(cam).getPropertyValue('--fade'))||0;
  clearTimeout(FUNDO_T);
  if(ms<=0){ tela.style.background=alvo; fx.style.transition='none'; fx.style.opacity='0'; return; }
  fx.style.transition='none'; fx.style.opacity='0'; fx.style.background=alvo;
  void fx.offsetWidth;                     // firma o estado antes de animar
  fx.style.transition='opacity '+ms+'ms ease';
  fx.style.opacity='1';
  FUNDO_T=setTimeout(()=>{ tela.style.background=alvo; fx.style.transition='none'; fx.style.opacity='0'; }, ms+50);
}
/* TELA PRONTA — a animação das CIAS e o slide do PowerPoint.
   A imagem JÁ é a tela inteira (título, letra e arte), então ela não se soma a
   nada: só aparece. Vai INTEIRA, sem esticar, porque as telas das CIAS são 4:3
   (1440x1080, as 337) e o telão é 16:9 — esticar engordaria a letra e o desenho
   em 33%. O que sobra dos lados fica preto, como num telão de cinema.
   ESTE MODO FALTAVA: o Sistema mandava modo:'slide' e nenhum caso o atendia, de
   modo que a animação das CIAS caía no vazio e o telão ficava PRETO. Era por
   isso que o Samuel nunca tinha visto a função das CIAS funcionar. */
function telaPronta(url){ tela.style.background = url?`#000 url('${url}') center/contain no-repeat`:'#000'; }
// auto-ajuste: reduz a fonte até o conteúdo caber na caixa (nenhum louvor/versículo quebra)
/* Ajusta a fonte para o texto SEMPRE caber inteiro na caixa.
   A escala do A-/A+ entra ANTES do ajuste: aumentar aumenta, mas nunca deixa cortar. */
/* O AVANÇO DE LINHA CEDE ESPAÇO PARA A LETRA CRESCER.
   1.815 é a medida da transmissão oficial e é o padrão — a igreja vê assim.
   Mas num slide de 8 ou 9 linhas o texto já enche a tela, e aumentar a letra
   não tinha de onde tirar espaço: o A+ não mudava um pixel.
   Quando o operador pede MAIOR, o respiro entre as linhas encolhe um pouco
   (nunca abaixo de 1.5, que é onde a leitura à distância começa a sofrer) e
   a letra usa esse espaço. Pedindo MENOR, o respiro volta ao normal. */
function avancoLinha(escala){
  const e = escala || 1;
  return e <= 1 ? 1.815 : Math.max(1.5, 1.815 / Math.pow(e, 0.55));
}
function fit(box, cqh, escala, crescer, linhasRef){
  const w = box.firstElementChild; if(!w) return;
  let base = Math.max(6, cqh/100*tela.clientHeight * (escala || 1));
  // linhasRef = maior slide do louvor: todos os slides ficam no MESMO tamanho (não "pula")
  if(linhasRef > 0){
    // 1.815 = o avanço de linha do louvor (line-height do .bloco .linha);
    // tem que andar JUNTO com o CSS, senão o teto mente.
    //
    // O A+ ENTRA AQUI TAMBÉM, e é por isso que ele antes não funcionava: em
    // louvor de muitas linhas (o "TENHO UMA CANDEIA" é um) o teto vencia
    // sempre, e aumentar a letra não mudava um pixel. Agora o teto sobe junto
    // — e quem impede o texto de vazar continua sendo o encolhe-até-caber
    // logo abaixo, que nunca deixa cortar.
    const teto = box.clientHeight / (linhasRef * avancoLinha(escala)) * (escala || 1);
    if(teto < base) base = Math.max(6, teto);
  }
  let px = base;
  box.style.fontSize = px+'px';
  // largura ÚTIL: clientWidth inclui o respiro lateral, e comparar com ele
  // deixava o texto avançar por cima da margem sem ninguém reclamar
  const cs0 = getComputedStyle(box);
  const larg = box.clientWidth - parseFloat(cs0.paddingLeft||0) - parseFloat(cs0.paddingRight||0);
  const cabe = ()=> w.scrollHeight - box.clientHeight <= 1 && w.scrollWidth - larg <= 1;
  for(let i=0;i<20;i++){                       // encolhe até caber — nunca desiste no meio
    if(cabe()) break;
    const r = Math.min(box.clientHeight/w.scrollHeight, larg/w.scrollWidth) * 0.98;
    px *= (r < 1 ? r : 0.94);
    if(px < 6){ px = 6; box.style.fontSize = px+'px'; break; }
    box.style.fontSize = px+'px';
  }
  // Uma linha "quebrou" quando ela virou duas: aviso com a frase partida no meio
  // ("Culto de Senhoras —" numa linha e "19:30" na outra) fica feio, mesmo cabendo.
  const quebrou = () => {
    // mede as LINHAS de verdade: com o aviso em tabela, w.children é a grade
    // inteira e ela sempre pareceria "quebrada", travando o crescer
    const finas = w.querySelectorAll('.linha, .cel');
    for(const el of (finas.length ? finas : w.children)){
      // mede quem REALMENTE tem o texto: o título do aviso mora dentro de um
      // .mk com margem própria, e a margem entrava na conta — a linha parecia
      // quebrada sem ter quebrado, e o crescer nunca saía do lugar
      const alvo = (el.children.length === 1 && el.firstElementChild) ? el.firstElementChild : el;
      const lh = parseFloat(getComputedStyle(alvo).lineHeight) || (px * 1.42);
      if(alvo.offsetHeight > lh * 1.6) return true;
    }
    return false;
  };
  // sobrou espaço (ex.: só 1 versículo)? cresce até preencher, sem passar do limite
  //
  // O TETO DO AVISO ERA 1,7 E ISSO É GRANDE DEMAIS. Medido no telão: o
  // "ATENÇÃO — desligue o celular" chegava a 8,51% da altura da tela, quase o
  // DOBRO da letra do louvor oficial (4,36%), e a linha ocupava 86,6% da
  // largura. Aviso é recado, não letreiro: com 1,15 um aviso de uma palavra
  // ainda ganha corpo, e o de duas linhas fica maior que o louvor sem virar
  // outra coisa na mesma tela (o título já sai 1,25x maior que o corpo).
  if(crescer && px >= base - 0.5 && !quebrou()){
    const teto = base * (crescer === 'aviso' ? 1.15 : 2.2);
    for(let i=0;i<18;i++){
      const tentativa = px * 1.06; if(tentativa > teto) break;
      box.style.fontSize = tentativa+'px';
      if(!cabe() || quebrou()){ box.style.fontSize = px+'px'; break; }
      px = tentativa;
    }
  }
}

function aplicar(e){
  if(e.estilo) tela.className = 'e-'+e.estilo;
  ULT = ['biblia','louvor','texto','bibmulti'].includes(e.modo) ? e : null;   // p/ re-ajustar quando fontes carregam / tela muda
  const fade = e.transicao ? (e.fade||600) : 0;
  cam.style.setProperty('--fade', fade+'ms');
  const render=()=>{
    limpar();
    if(e.modo==='preto'){ fundo(''); }
    else if(e.modo==='fundo'){ fundo(e.fundo); }
    else if(e.modo==='slide'){ telaPronta(e.src); }   // CIAS e PowerPoint
    else if(e.modo==='biblia'){
      fundo(e.fundo); el.ref.style.display='flex'; el.bib.style.display='flex';
      el.ref.textContent=e.ref||''; linhas(el.bib, e.linhas||[]); fit(el.bib, e.tam||5.55, e.escala);
    }
    else if(e.modo==='bibmulti'){
      fundo(e.fundo); el.multi.style.display='flex'; el.multi.innerHTML='';
      const w=document.createElement('div'); w.className='fitw';
      (e.itens||[]).forEach((it,i)=>{
        const r=document.createElement('span'); r.className='vm-ref'+(i===0?' first':''); r.textContent=it.ref; w.appendChild(r);
        const t=document.createElement('span'); t.className='vm-txt'; t.textContent=it.texto; w.appendChild(t);
      });
      // começa no tamanho natural do versículo e só DIMINUI conforme entram mais (nunca estoura)
      el.multi.appendChild(w); fit(el.multi, e.tam||5.55, e.escala);
    }
    else if(e.modo==='louvor'){
      fundo(e.fundo);
      if(e.titulo){ el.tit.style.display='flex'; el.tit.textContent=e.titulo; }
      // Sem a faixa do título o bloco oficial SOBE: na transmissão as linhas
      // vão de 18,2% a 88,9% (rótulo CORO acima delas), contra 19,6%–90,3%
      // com faixa. Sem esta folga o slide de CORO (rótulo + 7 linhas) não
      // cabia e o auto-ajuste encolhia a letra — media 8,8% de avanço na tela
      // quando o oficial mantém os mesmos 11,05% do slide com faixa.
      el.lou.style.top = e.titulo ? '' : '9%';
      el.lou.style.height = e.titulo ? '' : '82%';
      el.lou.style.display='flex'; el.lou.className='txt';
      el.lou.innerHTML=''; const bloco=document.createElement('div'); bloco.className='bloco';
      // o rótulo diz TAMBÉM qual repetição é esta ("CORO · 2ª de 3"). Sem isso
      // o slide repetido era idêntico ao primeiro e ninguém sabia onde estava.
      if(e.label || e.selo){
        const lb=document.createElement('span'); lb.className='label-coro';
        // REGRA DO SAMUEL (18/08, fechada): coro sem repetição = "CORO";
        // coro com bis = "CORO 2x"; repetição fora do coro = "cantar 2x";
        // "repete o hino" quando o livro manda repetir inteiro. O contador
        // "1ª de N" MORREU de vez — nem o operador precisa (ele vê a prévia).
        const vezes = e.selo === 'bis' ? '2x' : e.selo;   // bis = 2x
        let t = '';
        if (e.selo === 'hino') t = (e.label ? e.label + ' · ' : '') + 'repete o hino';
        else if (e.label && e.selo) t = e.label + ' ' + vezes;      // "CORO 2x"
        else if (e.label) t = e.label;                              // "CORO"
        else if (e.selo) t = 'cantar ' + vezes;                     // "cantar 2x"
        lb.textContent = t; bloco.appendChild(lb);
      }
      (e.linhas||[]).forEach(l=>bloco.appendChild(montarLinha(l)));
      bloco.style.setProperty('--lh', avancoLinha(e.escala));
      el.lou.appendChild(bloco); fit(el.lou, e.tam||6.4, e.escala, false, e.linhasRef);
      if(e.fim && (e.linhas||[]).length) el.fim.style.display='block';   // "fim" no último slide
      // "3 de 4" — só na prévia do celular (a congregação nunca vê)
      if(PREVIA && e.pos && e.de){ el.pos.textContent = e.pos + ' de ' + e.de; el.pos.style.display='block'; }
      else el.pos.style.display='none';
    }
    else if(e.modo==='texto'){
      fundo(e.fundo); el.livre.style.display='flex';
      // telas padrão têm faixa no topo: o texto se encaixa ABAIXO dela sozinho
      const comBarra = e.zona === 'barra';
      el.livre.style.top = comBarra ? '22%' : '10%';
      el.livre.style.height = comBarra ? '72%' : '80%';
      // aviso costuma ter 2 ou 3 linhas curtas: sem CRESCER ele ficava boiando
      // minúsculo no meio da tela, ilegível do fundo da igreja
      montarAviso(el.livre, e.linhas||[]); fit(el.livre, e.tam||6, e.escala, 'aviso');
    }
    else if(e.modo==='relogio'){
      fundo(e.fundo); el.grande.style.display='flex';
      const DIAS=['DOMINGO','SEGUNDA-FEIRA','TERÇA-FEIRA','QUARTA-FEIRA','QUINTA-FEIRA','SEXTA-FEIRA','SÁBADO'];
      const MES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
      const tick=()=>{const d=new Date();
        el.grandeS.textContent=DIAS[d.getDay()]+' · '+d.getDate()+' DE '+MES[d.getMonth()]+' DE '+d.getFullYear();
        el.grandeV.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
      tick(); relogioInt=setInterval(tick,1000);
    }
    else if(e.modo==='timer'){
      fundo(e.fundo); el.grande.style.display='flex'; el.grandeS.textContent=e.rotulo||'';
      if(e.parado){ el.grandeV.textContent=e.texto||'0:00'; return; }
      const fim=e.fimTs;
      const tick=()=>{let s=Math.max(0,Math.round((fim-Date.now())/1000));
        el.grandeV.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(s<=0) clearInterval(timerInt);};
      tick(); timerInt=setInterval(tick,250);
    }
  };
  clearTimeout(fadeT);   // cancela um fade pendente: comando novo sempre vence o antigo
  if(fade){ cam.classList.add('oculto'); fadeT = setTimeout(()=>{render();cam.classList.remove('oculto');}, fade*0.5); }
  else { render(); cam.classList.remove('oculto'); }
}
// janela PRÓPRIA do Sistema: recebe pelo canal (não existe "window.opener" aqui)
try{ const c=new BroadcastChannel('sistema-projecao');
     c.onmessage = e => { try{ aplicar(typeof e.data==='string'?JSON.parse(e.data):e.data); }catch(_){} }; }catch(e){}
window.addEventListener('message', ev=>{ try{
  const d = typeof ev.data==='string'?JSON.parse(ev.data):ev.data;
  if(d && d.tipo==='fullscreen'){ telaCheiaNoProjetor(); return; }
  aplicar(d);
}catch(e){} });
// na janela PRÓPRIA do Sistema quem posiciona é o Windows — nada de pedir permissão ao navegador
const JANELA_PROPRIA = location.search.indexOf('nativo=1') >= 0;
// tela cheia NA TELA DO PROJETOR (API oficial de janelas — nada de simular teclas do Windows)
async function telaCheiaNoProjetor(){
  if(JANELA_PROPRIA || document.fullscreenElement) return;
  let alvo=null;
  try{
    if('getScreenDetails' in window){
      const sd=await window.getScreenDetails();
      alvo = sd.screens.find(s=>!s.isInternal && s!==sd.currentScreen) || sd.currentScreen;
    }
  }catch(e){}
  try{ await document.documentElement.requestFullscreen(alvo?{screen:alvo}:undefined); }
  catch(e){ try{ await document.documentElement.requestFullscreen(); }catch(_){} }
}
document.body.addEventListener('dblclick',()=>{ if(!document.fullscreenElement) telaCheiaNoProjetor(); else document.exitFullscreen(); });
// a janela de projeção fica na frente e rouba o foco (sem tela secundária) -> repassa as teclas p/ o controle
const CMD={ArrowRight:'prox',' ':'prox',ArrowLeft:'ant','+':'mais','=':'mais','-':'menos',p:'descanso',b:'preto',f:'freeze'};
let canalCmd=null; try{ canalCmd=new BroadcastChannel('sistema-projecao'); }catch(e){}
addEventListener('keydown',e=>{
  const c=CMD[e.key.length===1?e.key.toLowerCase():e.key]; if(!c) return;
  e.preventDefault();
  if(window.opener){ try{window.opener.postMessage({tipo:'cmd',cmd:c},'*');}catch(_){} }
  if(canalCmd){ try{ canalCmd.postMessage({tipo:'cmd',cmd:c}); }catch(_){} }   // janela própria
});
// tenta tela cheia ao abrir (herda o gesto do clique que abriu a janela)
if(standalone){ addEventListener('load',()=>{ setTimeout(telaCheiaNoProjetor,200); }); }
// re-ajusta o tamanho quando as fontes terminam de carregar e quando a tela muda de tamanho (F11, projetor)
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(ULT) aplicar(Object.assign({},ULT,{transicao:false})); });
let rzT; addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(ULT) aplicar(Object.assign({},ULT,{transicao:false})); },150); });
if(window.opener) try{ window.opener.postMessage({tipo:'proj-pronta'},'*'); }catch(e){}
// janela própria: avisa o controle pelo canal que já pode receber o conteúdo
if(JANELA_PROPRIA){ try{ const c2=new BroadcastChannel('sistema-projecao'); c2.postMessage({tipo:'proj-pronta'}); }catch(e){} }
